<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BonziBOX</title>

    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="icon" type="image/png" href="/logo.png">
</head>
<body>

<div id="loginScreen">

    <div id="loginBox">

        <h1>
            <p style="text-align: center"><img src="logo.png" width="300" height="300"></p>
        </h1>

        <input
            id="username"
            placeholder="Username"
            maxlength="32"
        >

        <input
            id="pfp"
            placeholder="Profile Picture URL (optional)"
        >

        <button id="join">
            --->
        </button>
        <br>
        <p style="text-align: center;">
        <br>Welcome to BonziBOX!
        <br><a href="readme">
            README
        </a> - 
            <a href="changelog">
            Changelog
            </a>
            <h6>Version 1.0.1</h6>
        </p>
    </div>

</div>

<div id="chatPage">

    <div id="chat"></div>

    <div id="chatBar">

        <input
            id="message"
            placeholder="Enter a message..."
            autocomplete="off"
        >

        <button id="send">
            Send
        </button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>
</html>
